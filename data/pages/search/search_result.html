<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{query}} - 371tti.net/search">
    <meta property="og:description" content="{{query}} - 371tti.net/search">
    <meta property="og:title" content="{{query}} - 371tti.net/search">
    <meta property="og:type" content="article">
    <meta property="og:url" content="{{request_url}}">
    <title>{{query}} - 371tti.net/search</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/tag.css">
    <script src="/menu.js"></script>
    <style>
        .query-matched {
            background-color: var(--color-bg-1);
            padding-top: 2mm;
            padding-bottom: 2mm;
        }
    </style>
</head>

<body class="center-y">
    <script src="/box-load-anime.js"></script>
    <div class="center-x scroll">
    <div class="card">
    <div class="box">
        <div class="flex block-m">
            <h1>Search results</h1>
            <div class="block subtitle">
                <h2><a href="/">371tti.net</a></h2>
            </div>
        </div>

        <div class="indent">
            <p>query: {{query}},</p>
            <p>range: {{range}},</p>
            <p>algorithm: {{algorithm}}</p>
            <p>tokens: {{tokens}}</p>
            <p><a href="/search">↼ click to new search</a></p>
        </div>
    </div>
    <hr>
    <div class="box" id="results-container">
        {{results}}
    </div>
    <hr>
    <p class="center">© 2024~ 371tti</p>
    <p class="center"><a href="/">top_page</a>　-　<a href="/terms">terms</a></p>
</div>
</div>

<script>
    // 検索結果をqueryとtokensに基づいてソート
    document.addEventListener('DOMContentLoaded', function() {
        const query = '{{query}}'.toLowerCase();
        const tokensStr = '{{tokens}}';
        const tokens = tokensStr.split(',').map(t => t.trim().toLowerCase()).filter(t => t.length > 0);
        
        const container = document.getElementById('results-container');
        const results = Array.from(container.children);
        
        results.sort((a, b) => {
            const titleA = a.querySelector('h3 a')?.textContent.toLowerCase() || '';
            const titleB = b.querySelector('h3 a')?.textContent.toLowerCase() || '';
            
            // queryマッチを最優先でチェック
            const aQueryMatch = titleA.includes(query);
            const bQueryMatch = titleB.includes(query);
            
            // tokensマッチをチェック
            const aTokenMatch = tokens.some(token => titleA.includes(token));
            const bTokenMatch = tokens.some(token => titleB.includes(token));
            
            // マッチした要素にクラスを追加
            if (aQueryMatch || aTokenMatch) a.classList.add('query-matched');
            if (bQueryMatch || bTokenMatch) b.classList.add('query-matched');
            
            // ソート優先順位: query > tokens > その他
            if (aQueryMatch && !bQueryMatch) return -1;
            if (!aQueryMatch && bQueryMatch) return 1;
            if (aTokenMatch && !bTokenMatch) return -1;
            if (!aTokenMatch && bTokenMatch) return 1;
            return 0;
        });
        
        results.forEach(result => container.appendChild(result));
    });
</script>

</body>

</html>
