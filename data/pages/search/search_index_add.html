<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="371tti.net search engine">
    <meta property="og:description" content="371tti.net scripts search engine">
    <meta property="og:title" content="371tti.net search engine">
    <meta property="og:type" content="article">
    <meta property="og:url" content="/search">
    <title>SearchEngine - 371tti.net</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/menu.js"></script>
</head>

<body>


    <script src="/box-load-anime.js"></script>

    <div class="full center center-middle">
        <div class="main card grid-2" id="content">
            <div class="box r1">
                <div class="box">
                    <div class="flex">
                        <h1>Search Engine Index Forum</h1>
                        <div class="block subtitle">
                            <h2>371tti.net</h2>
                        </div>
                    </div>
                </div>
                <div class="box">
                    <div class="pd"></div>
                    <div class="flex-column">
                        <label style="font-size:0.9em;opacity:.8;">URL (複数可 / 空白区切り)</label>
                        <input type="text" id="url" name="url" placeholder="example.com  example.org/wiki" required>
                        <label style="font-size:0.9em;opacity:.8;margin-top:8px;">Title (任意)</label>
                        <input type="text" id="title" name="title" placeholder="optional title">
                        <label style="font-size:0.9em;opacity:.8;margin-top:8px;">Favicon URL (任意)</label>
                        <input type="text" id="favicon" name="favicon" placeholder="https://.../favicon.ico">
                        <label style="font-size:0.9em;opacity:.8;margin-top:8px;">Tags (クリックで選択 / 再クリックで解除)</label>
                        <div id="tags_box" class="flex wrap" style="gap:4px;margin-top:4px;">
                            <input type="button" class="tag-btn" data-tag="wiki" value="wiki" />
                            <input type="button" class="tag-btn" data-tag="news" value="news" />
                            <input type="button" class="tag-btn" data-tag="sns" value="sns" />
                            <input type="button" class="tag-btn" data-tag="blog" value="blog" />
                            <input type="button" class="tag-btn" data-tag="forum" value="forum" />
                            <input type="button" class="tag-btn" data-tag="shopping" value="shopping" />
                            <input type="button" class="tag-btn" data-tag="academic" value="academic" />
                            <input type="button" class="tag-btn" data-tag="tools" value="tools" />
                        </div>
                        <label style="font-size:0.9em;opacity:.8;margin-top:8px;">Description (任意)</label>
                        <textarea id="descriptions" name="descriptions" rows="3" placeholder="short description"></textarea>
                        <div style="margin-top:10px;" class="flex">
                            <a class="button" id="search_button" href="#">
                                <p>Index</p>
                            </a>
                            <a class="button" id="clear_optional" href="#" style="margin-left:6px;">
                                <p>Clear Opt</p>
                            </a>
                        </div>
                        <small style="opacity:.7;display:block;margin-top:6px;line-height:1.4;">
                            送信形式: POST /api/index (JSON body: url, title?, favicon?, tags[], descriptions?)<br>
                            任意フィールドは未入力なら省略 / tags は選択なしで []。
                        </small>
                    </div>
                </div>
            </div>
            <div class="box r1" style="height: 90svh;">
                <div id="log" class="full scroll" style="white-space: pre-wrap; font-family: Consolas, monospace;"></div>
            </div>
        </div>

    </div>

    <p class="center">© 2024~ 371tti</p>
    <p class="center"><a href="/">top_page</a>　-　<a href="/terms">terms</a></p>

    <script>
        (function () {
            const elUrl = document.getElementById('url');
            const elTitle = document.getElementById('title');
            const elFavicon = document.getElementById('favicon');
            const elDesc = document.getElementById('descriptions');
            const btn = document.getElementById('search_button');
            const btnClear = document.getElementById('clear_optional');
            const logEl = document.getElementById('log');
            const tagBox = document.getElementById('tags_box');
            const tagButtons = Array.from(tagBox.querySelectorAll('.tag-btn'));

            tagButtons.forEach(b => {
                b.addEventListener('click', () => b.classList.toggle('active'));
            });

            function getSelectedTags() {
                return tagButtons.filter(b => b.classList.contains('active')).map(b => b.dataset.tag);
            }

            let nextId = 1;
            function mkEntry(id, text) {
                const line = document.createElement('div');
                line.dataset.id = String(id);
                line.textContent = text;
                logEl.appendChild(line);
                logEl.scrollTop = logEl.scrollHeight;
                return line;
            }
            function setEntry(line, text) {
                line.textContent = text;
                logEl.scrollTop = logEl.scrollHeight;
            }

            function normalizeInputUrl(u) {
                const v = (u || '').trim();
                if (!v) return '';
                // フラグメント除去 (#以降)
                return v.split('#')[0];
            }

            function buildBody(rawUrl) {
                const url = normalizeInputUrl(rawUrl);
                const body = { url };
                const t = (elTitle.value || '').trim();
                if (t) body.title = t;
                const fv = (elFavicon.value || '').trim();
                if (fv) body.favicon = fv;
                const desc = (elDesc.value || '').trim();
                if (desc) body.descriptions = desc;
                body.tags = getSelectedTags();
                return body;
            }

            async function runOne(raw) {
                const targetRaw = (raw || '').trim();
                if (!targetRaw) return;
                const id = nextId++;
                const endpoint = `/api/index`; // URLはボディに含める
                const body = buildBody(targetRaw);
                if (!body.url) {
                    mkEntry(id, `[#${id}] skip 空URL`);
                    return;
                }
                const line = mkEntry(id, `[#${id}] POST ${endpoint} url=${body.url}`);
                try {
                    const resp = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    const ct = resp.headers.get('content-type') || '';
                    let rawText = await resp.text();
                    let parsed = null;
                    if (ct.includes('application/json')) {
                        try { parsed = JSON.parse(rawText); } catch { }
                    }
                    if (parsed) {
                        if (parsed.success === 'true') {
                            const { url, title, favicon, tags, descriptions } = parsed;
                            const summary = `success\n url: ${url}\n title: ${title}\n favicon: ${favicon || '--'}\n tags: ${(tags || []).join(', ') || '[]'}\n descriptions: ${descriptions}`;
                            setEntry(line, `[#${id}] OK (${resp.status})\n${summary}`);
                        } else {
                            setEntry(line, `[#${id}] FAIL (${resp.status})\n error: ${parsed.error}`);
                        }
                    } else {
                        setEntry(line, `[#${id}] RESP (${resp.status})\n${rawText}`);
                    }
                } catch (e) {
                    setEntry(line, `[#${id}] ERROR\n${e}`);
                }
            }

            function go() {
                const raw = elUrl.value || '';
                const parts = raw.split(/[\s,]+/).filter(Boolean);
                if (!parts.length) { elUrl.focus(); return; }
                elUrl.value = '';
                parts.forEach(runOne);
            }

            btn?.addEventListener('click', (e) => { e.preventDefault(); go(); });
            elUrl?.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); go(); } });
            btnClear?.addEventListener('click', (e) => { e.preventDefault(); elTitle.value = ''; elFavicon.value = ''; elDesc.value = ''; tagButtons.forEach(b => b.classList.remove('active')); });
        })();
    </script>
</body>

</html>
