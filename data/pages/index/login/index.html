
<body class="center-y">
    <script src="/box-load-anime.js"></script>
    <link rel="stylesheet" href="/modern-border.css">
    <script src="/modern-border.js"></script>
    <script src="/box-load-anime.js"></script>
    <div class="center-x scroll">
        <div class="card grid-2" id="content">
            <div class="box r1">
                <div class="box">
                    <div class="flex block-m">
                        <h1>Login</h1>
                        <div class="block subtitle">
                            <h2><a href="/">371tti.net</a></h2>
                        </div>
                    </div>
                </div>
                <div class="box">
                    <p id="info">Enter to get 371tti.net service</p>
                    <div class="flex-column">
                        <input type="text" id="username" name="username" placeholder="username" required>
                    </div>
                    <div class="flex-column">
                        <input type="password" id="password" name="password" autocomplete="current-password"
                            placeholder="password" required>
                    </div>
                    <div class="pd"></div>
                    <a class="button right" id="login_button" href="#">
                        <p>login</p>
                    </a>
                </div>
            </div>
            <div class="box indent r1">
                <h2>select account</h2>
                <div class="pd"></div>
                <!-- <div class="flex">
            <div class="user-icon" style="height: 12mm;">
                <img src="/371tti_icon.png" alt="371tti" style="height: 100%; width: 100%;">
            </div>
            <div class="flex-column">
                <h3>@example</h3>
                <p>you have no sessions</p>
            </div>
        </div> -->

            </div>

        </div>

    </div>
</body>
<script>
    (() => {
        const $ = (id) => document.getElementById(id);
        const infoEl = $("info");
        const usernameEl = $("username");
        const passwordEl = $("password");
        const loginBtn = $("login_button");
        const selectBox = document.querySelector("#content .box.indent.r1");

        function showInfo(msg, isError = false) {
            if (!infoEl) return;
            infoEl.textContent = msg;
            infoEl.style.color = isError ? "#c00" : "";
        }

        function parseStatus(status) {
            // status は "Logout" か { Enable: "RFC3339" }
            if (typeof status === "string") return { kind: status, time: null };
            if (status && typeof status === "object" && "Enable" in status) {
                return { kind: "Enable", time: status.Enable };
            }
            return { kind: "Unknown", time: null };
        }

        async function fetchSession() {
            try {
                const res = await fetch("/api/session", { credentials: "include" });
                if (!res.ok) {
                    renderAccounts(null);
                    return;
                }
                const state = await res.json();
                renderAccounts(state);
            } catch (e) {
                renderAccounts(null);
            }
        }

        function renderAccounts(state) {
            if (!selectBox) return;
            // ヘッダ以外をクリア
            const keep = Array.from(selectBox.children).slice(0, 3); // h2, .pd, 次要素(余白)
            selectBox.replaceChildren(...keep);

            // 現在ログイン中のアカウントID（存在すれば）
            const loggedId = state?.is_logged_in ? state.logged_account : null;

            if (!state || !Array.isArray(state.authenticated_accounts) || state.authenticated_accounts.length === 0) {
                const p = document.createElement("p");
                p.textContent = "you have no sessions";
                selectBox.appendChild(p);
                return;
            }

            const list = document.createElement("div");
            list.className = "flex-column";
            state.authenticated_accounts.forEach((acc) => {
                const row = document.createElement("div");
                row.className = "flex";
                row.style.alignItems = "center";
                row.style.gap = "8px";
                row.style.justifyContent = "space-between";

                const title = document.createElement("div");
                const st = parseStatus(acc.status);
                const last = st.time ? `last: ${st.time}` : st.kind === "Logout" ? "logged out" : st.kind;
                title.innerHTML = `<strong>@${acc.account_id}</strong><br><small>${last}</small>`;

                row.appendChild(title);

                // 現在ログイン中のアカウントならボタンは表示しない
                if (!(loggedId && acc.account_id === loggedId)) {
                    const btn = document.createElement("a");
                    btn.className = "button";
                    btn.href = "#";
                    btn.textContent = "login";
                    btn.addEventListener("click", async (e) => {
                        e.preventDefault();
                        await loginSkip(acc.account_id);
                    });
                    row.appendChild(btn);
                } else {
                    const badge = document.createElement("span");
                    badge.className = "button disabled";
                    badge.textContent = "current";
                    row.appendChild(badge);
                }

                list.appendChild(row);
            });

            selectBox.appendChild(list);
        }

    async function loginSkip(accountId) {
            showInfo("Signing in...", false);
            try {
                const res = await fetch("/api/auth", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({
            skip_password: true,
            account_id: accountId,
            password: ""
                    })
                });
                const data = await res.json().catch(() => ({}));
                if (res.ok && data && data.success) {
                    const redirect = data.redirect_to || "/index";
                    showInfo("Login successful! Redirecting...");
                    location.href = redirect;
                } else {
                    const msg = (data && (data.message || data.error)) || "Login failed.";
                    showInfo(msg, true);
                    await fetchSession(); // 失敗時は一覧を更新
                }
            } catch (e) {
                showInfo("Network error.", true);
            }
        }

        async function loginWithPassword() {
            const username = usernameEl?.value?.trim() || "";
            const password = passwordEl?.value || "";
            if (!username || !password) {
                showInfo("Please fill in all fields.", true);
                return;
            }
            showInfo("Signing in...", false);
            try {
                const res = await fetch("/api/auth", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({
                        skip_password: false,
                        account_id: username,
                        password: password
                    })
                });
                const data = await res.json().catch(() => ({}));
                if (res.ok && data && data.success) {
                    const redirect = data.redirect_to || "/index";
                    showInfo("Login successful! Redirecting...");
                    location.href = redirect;
                } else {
                    const msg = (data && (data.message || data.error)) || "Invalid username or password.";
                    showInfo(msg, true);
                }
            } catch (e) {
                showInfo("Network error.", true);
            }
        }

        loginBtn?.addEventListener("click", (e) => {
            e.preventDefault();
            loginWithPassword();
        });

        // 初期表示でセッションを確認
        fetchSession();
    })();
</script>
