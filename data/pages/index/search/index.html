<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="371tti.net search engine">
    <meta property="og:description" content="371tti.net scripts search engine">
    <meta property="og:title" content="371tti.net search engine">
    <meta property="og:type" content="article">
    <meta property="og:url" content="/search">
    <title>SearchEngine - 371tti.net</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/menu.js"></script>
</head>

<body>


    <script src="/box-load-anime.js"></script>

    <div class="full center center-middle">
        <div class="main card grid-2" id="content">
            <div class="box r1">
                <div class="box">
                    <div class="flex">
                        <h1>Search Engine</h1>
                        <div class="block subtitle">
                            <h2>371tti.net</h2>
                        </div>
                    </div>
                </div>
                <div class="box">
                    <p>Index contains <b>3,200,000 pages</b> ... (。-`ω-)</p>
                    <div class="pd"></div>
                    <div class="flex-column">
                        <input type="text" id="query" name="query" placeholder="write query here" required>
                    </div>
                    <div class="pd"></div>
                    <a class="button right" id="search_button" href="#">
                        <p>Search</p>
                    </a>
                </div>
            </div>
            <div class="box r1">
                <div class="flex full">
                    <div class="flex-column full">
                        <div class="pd"></div>
                        <h2>Options</h2>
                        <div class="pd"></div>
                        <div >
                            <label for="algorithm">select algorithm</label>
                            <select class="right" id="algorithm" name="algorithm">
                                <option value="default">bm25</option>
                                <option value="fast">dot</option>
                                <option value="accurate">cosine similarity</option>
                            </select>
                        </div>
                        <div>
                            <label for="top_k">number of results</label>
                        <input class="right" type="text" id="top_k" name="top_k" placeholder="1..1000" value="10" required>
                        </div>
                        <div>
                            <label for="bm25_k1">bm25 k1</label>
                            <input class="right" type="text" id="bm25_k1" name="bm25_k1" placeholder="1.2..2.0" value="1.5" required>
                        </div>
                        <div>
                            <label for="bm25_b">bm25 b</label>
                            <input class="right" type="text" id="bm25_b" name="bm25_b" placeholder="0.75" value="0.75" required>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <p class="center">© 2024~ 371tti</p>
    <p class="center"><a href="/">top_page</a>　-　<a href="/terms">terms</a></p>
</body>

</html>
