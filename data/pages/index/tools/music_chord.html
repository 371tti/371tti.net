<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="371tti.net tool music chord" />
    <meta property="og:description" content="371tti.net tool music chord" />
    <meta property="og:title" content="371tti.net tool music chord" />
    <meta property="og:type" content="article" />
    <meta property="og:url" content="/tool/music_chord" />
    <title>Music chord - 371tti.net</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/menu.js"></script>
</head>

<body>
    <script src="/box-load-anime.js"></script>

    <div class="full center center-middle">
        <div class="main card" id="content">
            <div class="flex block-m">
                <h1>Music Chord Player</h1>
                <div class="block subtitle">
                    <h2>371tti.net</h2>
                </div>
            </div>
            <!-- Progression field -->
            <div id="progression">
                <label>Progression: </label>
                <input id="prog-input" type="text" style="width: 60%" placeholder="e.g. C maj7 | A m7 | D m7 | G 7" />
                <a href="#" id="prog-load" class="button">Load</a>
                <a href="#" id="prog-play" class="button">Play Prog</a>
                <div id="preset-progs" style="margin-top: 6px"></div>
                <div id="prog-chords" style="margin-top: 6px"></div>
            </div>

            <!-- Controls (no CSS, table-based 2 columns) -->
            <div style="margin-top: 10px">
                <a href="#" id="toggle-advanced" class="button">Show Advanced</a>
            </div>
            <div id="advanced-controls" style="display: none">
                <table border="0" cellpadding="4" cellspacing="0" style="width: 100%; max-width: 900px">
                    <tr>
                        <td valign="top" style="width: 50%">
                            <h3>Root Notes</h3>
                            <div id="root-buttons">
                                <!-- filled by JS -->
                            </div>
                        </td>
                        <td valign="top" style="width: 50%">
                            <h3>Chord Types</h3>
                            <div id="type-buttons">
                                <!-- filled by JS -->
                            </div>
                        </td>
                    </tr>
                </table>

                <div>
                    <label>Pitch (semitones): </label>
                    <a href="#" class="button" id="pitch-dec">-</a>
                    <input id="pitch-input" type="number" value="0" step="1" min="-48" max="48" style="width:60px;text-align:center" />
                    <a href="#" class="button" id="pitch-inc">+</a>
                </div>
            </div>

            <div>
                <span>Selected: <strong id="current-selection">—</strong></span>
            </div>
            <div>
                <a href="#" class="button" id="play-chord">Play Chord</a>
                <a href="#" class="button" id="arpeggio">Arpeggio</a>
                <a href="#" class="button" id="stop">Stop</a>
            </div>

            <!-- Keyboard mock -->
            <div id="piano"></div>
        </div>
    </div>



    <script>
        // ===== WebAudio setup =====
        const audioContext =
            new (window.AudioContext || window.webkitAudioContext)();
        let playingNodes = [];

        // ===== Notes and helpers =====
        const NOTES = [
            "C",
            "C#",
            "D",
            "D#",
            "E",
            "F",
            "F#",
            "G",
            "G#",
            "A",
            "A#",
            "B",
        ];
        // A4 可変チューニング（デフォルト 440Hz）
        let A4_HZ = 440;
        // 周波数計算は A4 を基準に半音比で算出（12-TET）
        function freqOf(note, octave) {
            const idx = NOTES.indexOf(note);
            if (idx < 0) return NaN;
            // NOTE: NOTES の A は index 9
            const semisFromA4 = (octave - 4) * 12 + (idx - 9);
            return A4_HZ * Math.pow(2, semisFromA4 / 12);
        }

        // ===== Chord formulas (semitone intervals from root) =====
        const CHORDS = {
            "maj": [0, 4, 7],
            "min": [0, 3, 7],
            "sus2": [0, 2, 7],
            "sus4": [0, 5, 7],
            "dim": [0, 3, 6],
            "aug": [0, 4, 8],
            "7": [0, 4, 7, 10],
            "m7": [0, 3, 7, 10],
            "maj7": [0, 4, 7, 11],
        };

        // デモ再生用コード進行（より美しい例: Cmaj7→Am7→Dm7→G7→Em7→A7→Dm7→G7）
        const DEMO_PROGRESSIONS = [
            { root: "C", type: "maj7" },
            { root: "A", type: "m7" },
            { root: "D", type: "m7" },
            { root: "G", type: "7" },
            { root: "E", type: "m7" },
            { root: "A", type: "7" },
            { root: "D", type: "m7" },
            { root: "G", type: "7" },
        ];

        function playDemoProgression(octave = 4, tempo = 100) {
            let idx = 0;
            function playNext() {
                if (idx >= DEMO_PROGRESSIONS.length) return;
                const { root, type } = DEMO_PROGRESSIONS[idx++];
                playChordNow(root, type, octave);
                setTimeout(playNext, 60000 / tempo); // 1拍=60000/tempo ms
            }
            playNext();
        }

        // デモ進行集（プリセット生成に使用）
        const DEMO_SETS = [
            {
                name: "王道循環",
                progression: [
                    { root: "C", type: "maj7" },
                    { root: "A", type: "m7" },
                    { root: "D", type: "m7" },
                    { root: "G", type: "7" },
                ],
            },
            {
                name: "カノン進行",
                progression: [
                    { root: "C", type: "maj" },
                    { root: "G", type: "maj" },
                    { root: "A", type: "min" },
                    { root: "E", type: "min" },
                    { root: "F", type: "maj" },
                    { root: "C", type: "maj" },
                    { root: "F", type: "maj" },
                    { root: "G", type: "maj" },
                ],
            },
            {
                name: "小室進行",
                progression: [
                    { root: "A", type: "min" },
                    { root: "F", type: "maj" },
                    { root: "G", type: "maj" },
                    { root: "C", type: "maj" },
                ],
            },
            {
                name: "丸サ進行",
                progression: [
                    { root: "F", type: "maj" },
                    { root: "G", type: "maj" },
                    { root: "E", type: "min" },
                    { root: "A", type: "min" },
                ],
            },
            {
                name: "JTTOU進行",
                progression: [
                    { root: "F", type: "maj7" },
                    { root: "G", type: "7" },
                    { root: "E", type: "m7" },
                    { root: "A", type: "m7" },
                ],
            },
        ];

        // 進行の文字列化/解析
        function stringifyProg(arr) {
            return arr.map((c) => `${c.root} ${c.type}`).join(" | ");
        }
        // ルート正規化（フラット→シャープ）
        function normalizeRootToken(tok) {
            if (!tok) return null;
            const m = tok.match(/^([A-Ga-g])([#b]?)/);
            if (!m) return null;
            const letter = m[1].toUpperCase();
            const accidental = (m[2] || '');
            let n = letter + accidental;
            const FLAT2SHARP = { "Db": "C#", "Eb": "D#", "Gb": "F#", "Ab": "G#", "Bb": "A#" };
            if (FLAT2SHARP[n]) n = FLAT2SHARP[n];
            return n;
        }

        function parseProg(text) {
            if (!text) return [];
            const parts = text.split(/\||,/).map((s) => s.trim()).filter(Boolean);
            const mapType = (t) => {
                const raw = (t || '').replace(/\s+/g, '');
                const lower = raw.toLowerCase();
                // maj / M / Δ / △
                if (lower === 'maj' || raw === 'M' || /[Δ△]/.test(raw)) return 'maj';
                // maj7 / M7 / Δ7 / △7
                if (lower === 'maj7' || raw === 'M7' || /(?:Δ7|△7)/.test(raw)) return 'maj7';
                // minor
                if (lower === 'm' || lower === 'min') return 'min';
                if (lower === 'm7' || lower === 'min7') return 'm7';
                // dominant 7th
                if (lower === '7') return '7';
                // others
                if (lower === 'sus2') return 'sus2';
                if (lower === 'sus4') return 'sus4';
                if (lower === 'dim' || lower === 'o') return 'dim';
                if (lower === 'aug' || lower === '+') return 'aug';
                return 'maj';
            };
            return parts.map((p) => {
                const m = p.match(/^([A-G](?:#|b)?)(?:\s+)?(.*)$/i);
                if (!m) return null;
                const root = normalizeRootToken(m[1]);
                if (!root) return null;
                const type = mapType(m[2] || "maj");
                return { root, type };
            }).filter(Boolean);
        }

        // 現在の進行
        let currentProgression = [];

        function renderProgression() {
            const box = document.getElementById("prog-chords");
            if (!box) return;
            box.innerHTML = currentProgression.map((ch) => {
                const label = `${ch.root}${ch.type}`;
                return `<a href="#" class="button" data-chord="${ch.root}|${ch.type}"${selAttr(state.root === ch.root && state.type === ch.type)
                    }>${label}</a>`;
            }).join(" ");
        }

        function playProgression(arr, octave = 4, tempo = 100) {
            let i = 0;
            if (!arr || arr.length === 0) return;
            function step() {
                if (i >= arr.length) return;
                const { root, type } = arr[i++];
                state.root = root;
                state.type = type;
                renderButtons();
                renderProgression();
                updatePianoHighlight(root, type);
                playChordNow(root, type, octave);
                setTimeout(step, 60000 / tempo);
            }
            step();
        }

        // プリセット生成
        (function () {
            const el = document.getElementById("preset-progs");
            if (!el) return;
            el.innerHTML = DEMO_SETS.map((s, i) =>
                `<a href="#" class="button" data-preset="${i}">${s.name}</a>`
            ).join(" ");
            el.addEventListener("click", function (e) {
                const t = e.target;
                if (!(t instanceof HTMLElement) || t.tagName !== "A") return;
                e.preventDefault();
                const idx = parseInt(t.dataset.preset || "-1");
                const set = DEMO_SETS[idx];
                if (!set) return;
                currentProgression = set.progression.slice();
                document.getElementById("prog-input").value = stringifyProg(
                    currentProgression,
                );
                renderButtons();
                renderProgression();
            });
        })();

        // 進行入力操作
        (function () {
            const input = document.getElementById("prog-input");
            const loadBtn = document.getElementById("prog-load");
            const playBtn = document.getElementById("prog-play");
            const chordsBox = document.getElementById("prog-chords");
            loadBtn.addEventListener("click", function (e) {
                e.preventDefault();
                currentProgression = parseProg(input.value);
                renderButtons();
                renderProgression();
            });
            playBtn.addEventListener("click", function (e) {
                e.preventDefault();
                if (currentProgression.length === 0) {
                    currentProgression = parseProg(input.value);
                    renderProgression();
                }
                playProgression(currentProgression, state.baseOctave, 100);
            });
            chordsBox.addEventListener("click", function (e) {
                const t = e.target;
                if (!(t instanceof HTMLElement) || t.tagName !== "A") return;
                e.preventDefault();
                const [r, tp] = (t.dataset.chord || "|").split("|");
                state.root = r;
                state.type = tp;
                renderButtons();
                renderProgression();
                playChordNow(state.root, state.type, state.baseOctave);
            });
        })();

        // Advanced toggle
        (function () {
            const btn = document.getElementById("toggle-advanced");
            const box = document.getElementById("advanced-controls");
            btn.addEventListener("click", function (e) {
                e.preventDefault();
                const s = box.style.display;
                box.style.display = (s === "none" || !s) ? "block" : "none";
                btn.textContent = (box.style.display === "none")
                    ? "Show Advanced"
                    : "Hide Advanced";
            });
        })();

        // ===== UI build =====
        const typeButtons = document.getElementById("type-buttons");
        const rootButtons = document.getElementById("root-buttons");
    const pitchInput = document.getElementById("pitch-input");
    const pitchDecBtn = document.getElementById("pitch-dec");
    const pitchIncBtn = document.getElementById("pitch-inc");
        const currentSel = document.getElementById("current-selection");
    let state = { root: "G", type: "sus4", baseOctave: 4, transpose: 0 };

        function selAttr(cond) {
            return cond
                ? ' aria-current="true" style="background:var(--color-accent-1);color:var(--color-text-1);"'
                : "";
        }

        function renderButtons() {
            // chord types (aタグ)
            typeButtons.innerHTML = Object.keys(CHORDS).map((t) =>
                `<a href="#" class="button" data-type="${t}"${selAttr(state.type === t)
                }>${t}</a>`
            ).join(" ");

            // roots
            rootButtons.innerHTML = NOTES.map((n) =>
                `<a href="#" class="button" data-root="${n}"${selAttr(state.root === n)
                }>${n}</a>`
            ).join(" ");

            updateCurrent();
            updatePianoHighlight(state.root, state.type);
        }

        function updateCurrent() {
            const t = state.transpose;
            const sign = t === 0 ? '' : (t > 0 ? ` (+${t})` : ` (${t})`);
            currentSel.textContent = `${state.root} ${state.type}${sign}`;
        }

        // デモUIをコード進行ごとにまとめて表示
        function renderDemoSets() {
            const el = document.getElementById("demo-list");
            if (!el) return;
            el.innerHTML = DEMO_SETS.map((set, i) => {
                const chords = set.progression.map((ch) => {
                    const label = `${ch.root}${ch.type}`;
                    const selected =
                        (state.root === ch.root && state.type === ch.type)
                            ? ' aria-current="true" style="background:var(--color-accent-1);color:var(--color-text-1);"'
                            : "";
                    return `<a href="#" class="button" data-chord="${ch.root}|${ch.type}"${selected}>${label}</a>`;
                }).join(" ");
                return `<div class="demo-set"><a href="#" class="button" data-demo="${i}">▶ ${set.name}</a> <span class="progression">${chords}</span></div>`;
            }).join("");
        }

        function updateDemoSelection(root, type) {
            const container = document.getElementById("demo-list");
            if (!container) return;
            const links = container.querySelectorAll("a[data-chord]");
            links.forEach((a) => {
                const [r, t] = (a.getAttribute("data-chord") || "|").split("|");
                if (r === root && t === type) {
                    a.setAttribute("aria-current", "true");
                    a.setAttribute(
                        "style",
                        "background:var(--color-accent-1);color:var(--color-text-1);",
                    );
                } else {
                    a.removeAttribute("aria-current");
                    a.removeAttribute("style");
                }
            });
        }

        // ===== Events =====
        function onContainerClick(e) {
            const t = e.target;
            if (!(t instanceof HTMLElement)) return;
            if (t.tagName !== "A") return;
            e.preventDefault();
            // Chord Typesボタン押下時
            if (t.dataset.type) {
                state.type = t.dataset.type;
                renderButtons();
                playChordNow(state.root, state.type, state.octave);
                return;
            }
            if (t.dataset.root) {
                state.root = t.dataset.root;
                renderButtons();
                return;
            }
            // no octave buttons anymore
        }

        typeButtons.addEventListener("click", onContainerClick);
        rootButtons.addEventListener("click", onContainerClick);
        // pitch controls
        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
        function setTranspose(v){ state.transpose = clamp(v|0, -48, 48); if(pitchInput) pitchInput.value = String(state.transpose); renderButtons(); }
        if (pitchInput) {
            pitchInput.addEventListener('change', (e)=>{ const v = parseInt(pitchInput.value||'0'); setTranspose(v); });
        }
        if (pitchDecBtn) {
            pitchDecBtn.addEventListener('click', (e)=>{ e.preventDefault(); setTranspose(state.transpose - 1); });
        }
        if (pitchIncBtn) {
            pitchIncBtn.addEventListener('click', (e)=>{ e.preventDefault(); setTranspose(state.transpose + 1); });
        }

        // ===== Chord frequency builder =====
    function chordFrequencies(root, type, octave) {
            const rootIndex = NOTES.indexOf(root);
            if (rootIndex < 0) return [];
            const intervals = CHORDS[type] || CHORDS["maj"];
            return intervals.map((semi) => {
        const total = rootIndex + semi + (state.transpose || 0);
        const noteIndex = ((total % 12) + 12) % 12;
        const addOct = Math.floor(total / 12);
                const noteName = NOTES[noteIndex];
                return freqOf(noteName, octave + addOct);
            });
        }

        // ===== Playback =====
        function stopAll() {
            for (const n of playingNodes) {
                try {
                    n.osc.stop();
                    n.gain.disconnect();
                    n.osc.disconnect();
                } catch { }
            }
            playingNodes = [];
        }

        // 和音再生時にstopAll()を呼ばないように修正
        function playChordNow(root, type, octave) {
            if (audioContext.state === "suspended") {
                try {
                    audioContext.resume();
                } catch (_) { }
            }
            const freqs = chordFrequencies(root, type, octave);
            if (!freqs.length) return;
            const now = audioContext.currentTime;
            freqs.forEach((f) => {
                if (!Number.isFinite(f)) return; // guard invalid freq
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(f, now);
                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.exponentialRampToValueAtTime(0.25, now + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
                osc.connect(gain).connect(audioContext.destination);
                osc.start(now);
                osc.stop(now + 1.25);
                playingNodes.push({ osc, gain });
            });
        }

        document.getElementById("stop").addEventListener("click", function (e) {
            e.preventDefault();
            stopAll();
        });

        document.getElementById("play-chord").addEventListener(
            "click",
            async (e) => {
                e.preventDefault();
                if (audioContext.state === "suspended") await audioContext.resume();
                playChordNow(state.root, state.type, state.baseOctave);
            },
        );

        document.getElementById("arpeggio").addEventListener("click", async (e) => {
            e.preventDefault();
            if (audioContext.state === "suspended") await audioContext.resume();
            stopAll();
            const freqs = chordFrequencies(state.root, state.type, state.baseOctave);
            const now = audioContext.currentTime;
            freqs.forEach((f, i) => {
                const start = now + i * 0.18;
                const end = start + 0.9;
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(f, start);
                gain.gain.setValueAtTime(0.0001, start);
                gain.gain.exponentialRampToValueAtTime(0.22, start + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, end);
                osc.connect(gain).connect(audioContext.destination);
                osc.start(start);
                osc.stop(end + 0.02);
                playingNodes.push({ osc, gain });
            });
        });

        document.addEventListener("keydown", function (e) {
            // ノートキー（ユーザー指定）
            const noteKeyMap = {
                "z": "C",
                "s": "C#",
                "x": "D",
                "d": "D#",
                "c": "E",
                "v": "F",
                "g": "F#",
                "b": "G",
                "h": "G#",
                "j": "A",
                "n": "A#",
                "m": "B",
            };
            // コードタイプキー（1〜9）
            const chordTypeKeys = Object.keys(CHORDS);
            // ルート音
            if (noteKeyMap[e.key]) {
                state.root = noteKeyMap[e.key];
                renderButtons();
                return;
            }
            // コードタイプ
            if (e.key >= "1" && e.key <= String(chordTypeKeys.length)) {
                state.type = chordTypeKeys[parseInt(e.key) - 1];
                renderButtons();
                playChordNow(state.root, state.type, state.baseOctave);
                return;
            }
        });

        // デモ操作
        const demoList = document.getElementById("demo-list");
        if (demoList) {
            demoList.addEventListener("click", function (e) {
                const t = e.target;
                if (!(t instanceof HTMLElement)) return;
                if (t.tagName !== "A") return;
                e.preventDefault();
                if (t.dataset.demo) {
                    // legacy: playDemoSet was removed; optionally map to playProgression
                    // playDemoSet(parseInt(t.dataset.demo), state.baseOctave, 100);
                    const idx = parseInt(t.dataset.demo);
                    if (!isNaN(idx) && DEMO_SETS[idx]) {
                        playProgression(DEMO_SETS[idx].progression, state.baseOctave, 100);
                    }
                    return;
                }
                if (t.dataset.chord) {
                    const [root, type] = t.dataset.chord.split("|");
                    state.root = root;
                    state.type = type;
                    renderButtons();
                    updateDemoSelection(root, type);
                    playChordNow(state.root, state.type, state.baseOctave);
                }
            });
        }

        // 簡易キーボード模型 → 本物っぽい配列に更新
        function renderPiano() {
            const piano = document.getElementById("piano");
            if (!piano) return;
            const WHITE_W = 42, WHITE_H = 140;
            const BLACK_W = 28, BLACK_H = 90;
            const whites = ["C", "D", "E", "F", "G", "A", "B"];
            const blackPairs = [
                { note: "C#", after: "C" },
                { note: "D#", after: "D" },
                { note: "F#", after: "F" },
                { note: "G#", after: "G" },
                { note: "A#", after: "A" },
            ];
            const totalWidth = WHITE_W * whites.length;
            piano.innerHTML = `
    <div class="piano" style="position:relative; width:${totalWidth}px;">
      <div class="whites" style="display:flex;">
        ${whites.map((w) => (
                `<a href="#" class="button key white" data-note="${w}"
              style="display:inline-block; width:${WHITE_W}px; height:${WHITE_H}px; background:#fff; border:1px solid #ccc; box-sizing:border-box; border-bottom:3px solid #bbb; position:relative;"></a>`
            )).join("")
                }
      </div>
    </div>`;
            const container = piano.querySelector(".piano");
            const whitesBox = piano.querySelector(".whites");
            blackPairs.forEach((b) => {
                const afterEl = whitesBox.querySelector(
                    `a[data-note="${b.after}"]`,
                );
                if (!afterEl) return;
                const left = afterEl.offsetLeft + afterEl.offsetWidth -
                    (BLACK_W / 2);
                const a = document.createElement("a");
                a.href = "#";
                a.className = "button key black";
                a.setAttribute("data-note", b.note);
                a.setAttribute(
                    "style",
                    `position:absolute; top:0; left:${left}px; width:${BLACK_W}px; height:${BLACK_H}px; background:#000; border:1px solid #222; box-sizing:border-box;`,
                );
                container.appendChild(a);
            });
            piano.onclick = function (e) {
                const t = e.target;
                if (!(t instanceof HTMLElement) || t.tagName !== "A") return;
                e.preventDefault();
                const n = t.getAttribute("data-note");
                if (!n) return;
                state.root = n;
                renderButtons();
                playNoteNow(n, state.baseOctave, 0.9);
            };
            // 初回ハイライト
            updatePianoHighlight(state.root, state.type);
        }

        function playNoteNow(note, octave = 4, duration = 0.9) {
            if (audioContext.state === "suspended") {
                try {
                    audioContext.resume();
                } catch (_) { }
            }
            // apply transpose
            const baseIdx = NOTES.indexOf(note);
            const total = baseIdx + (state.transpose || 0);
            const noteIndex = ((total % 12) + 12) % 12;
            const addOct = Math.floor(total / 12);
            const adjNote = NOTES[noteIndex];
            const f = freqOf(adjNote, octave + addOct);
            const now = audioContext.currentTime;
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(f, now);
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.exponentialRampToValueAtTime(0.22, now + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
            osc.connect(gain).connect(audioContext.destination);
            osc.start(now);
            osc.stop(now + duration + 0.02);
            playingNodes.push({ osc, gain });
        }

        // 初期描画
        (function init() {
            // デフォルトは王道循環
            currentProgression = DEMO_SETS[0].progression.slice();
            const input = document.getElementById("prog-input");
            if (input) input.value = stringifyProg(currentProgression);
            renderButtons();
            renderProgression();
            renderPiano();
        })();

        function getChordPitchClasses(root, type) {
            const rootIndex = NOTES.indexOf(root);
            const intervals = CHORDS[type] || CHORDS["maj"];
            const t = state.transpose || 0;
            return intervals.map((semi) => NOTES[((rootIndex + semi + t) % 12 + 12) % 12]);
        }

        function updatePianoHighlight(root, type) {
            const piano = document.getElementById('piano');
            if (!piano) return;
            const pcs = new Set(getChordPitchClasses(root, type));
            const whites = piano.querySelectorAll('a.key.white');
            const blacks = piano.querySelectorAll('a.key.black');
            whites.forEach(a => {
                const n = a.getAttribute('data-note');
                if (pcs.has(n)) {
                    a.style.background = '#d9d9d9'; // highlight (white key) monotone
                } else {
                    a.style.background = '#fff';
                }
            });
            blacks.forEach(a => {
                const n = a.getAttribute('data-note');
                if (pcs.has(n)) {
                    a.style.background = '#666'; // highlight (black key) monotone
                    a.style.color = '#fff';
                    a.style.borderColor = '#444';
                } else {
                    a.style.background = '#000';
                    a.style.color = '';
                    a.style.borderColor = '#222';
                }
            });
        }

        (function () {
            const style = document.createElement('style');
            style.textContent = `
  .demo-set{display:block;margin-top:6px;}
  .progression{display:inline-block;margin-left:8px;}
  .key.white{user-select:none; transform:none !important; transition:none !important;}
  .key.black{user-select:none; z-index:2; transform:none !important; transition:none !important;}
  `;
            document.head.appendChild(style);
        })();
    </script>
</body>
