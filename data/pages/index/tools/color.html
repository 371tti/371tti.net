<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/style.css">
    <script src="/menu.js"></script>
</head>
<body>


<script src="/box-load-anime.js"></script>

<div class="full center center-middle" id="color-bg" style="background: #000; min-height: 100vh; position: relative;">
    <div id="ui-area" style="text-align:center;">
        <input type="color" id="colorPicker" value="#FFF">
    </div>
    <div id="cover" style="opacity:0; pointer-events:none; position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:9999999999;"></div>
</div>

<script>
const colorBg = document.getElementById('color-bg');
const colorPicker = document.getElementById('colorPicker');
const uiArea = document.getElementById('ui-area');
const cover = document.getElementById('cover');
let coverMode = false;

// 初期化
colorBg.style.background = '#000';
colorPicker.value = '#000';

colorPicker.addEventListener('input', function(e) {
    const color = e.target.value;
    colorBg.style.background = color;
    if (coverMode) cover.style.background = color;
});

function setCover(on) {
    coverMode = !!on;
    cover.style.opacity = coverMode ? '1' : '0';
    cover.style.pointerEvents = coverMode ? 'auto' : 'none';
    if (coverMode) cover.style.background = colorPicker.value;
}

// UI領域以外をクリックでON（カバー表示中は無視）
colorBg.addEventListener('click', function(e) {
    if (coverMode) return; // カバー表示中は親のクリックを無視
    if (uiArea.contains(e.target)) return; // UI操作は無視
    setCover(true);
});

// カバーをタップで解除（伝播を止める）
cover.addEventListener('click', function(e) {
    e.stopPropagation();
    setCover(false);
});
</script>

</body>
</html>
