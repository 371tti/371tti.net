[package]
name = "wk-371tti-net"
version = "0.5.5"
edition = "2024"

[dependencies]
env_logger = "0.11.8"
chrono = { version = "0.4.42", features = ["serde"] }
kurosabi = "0.5.4"
tokio = { version = "1.48.0"}
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive", "rc"] }
