[package]
name = "wk-371tti-net"
version = "2.2.2"
edition = "2024"

[dependencies]
kurosabi = { version = "0.6.18", features = ["tokio-server", "json", "file"] }
tokio = { version = "1", features = ["full"] }
markdown = "1"
syntect = { version = "5.3.0", default-features = false, features = [
    "default-fancy",
] }
pulldown-latex = "0.7"
env_logger = "0.11"
log = "0.4"
tf-idf-vectorizer = "0.10.1"
dashmap = "6.1"
gray_matter = "0.3.2"
serde = "1.0"
chrono = "0.4"
serde_yaml = "0.9.34-deprecated"
arc-swap = "1.8.2"
serde_json = "1.0"
srv-session = "0.2.1"
ciborium = "0.2.2"
getrandom = "0.4"
gix = { version = "0.80", default-features = false, features = [
    "status",
    "worktree-mutation",
    "blocking-network-client",
    "blocking-http-transport-reqwest",
    "blocking-http-transport-reqwest-rust-tls",
] }
humantime-serde = "1.1.1"

[profile.release]
opt-level = 3
lto = "fat"
strip = true
