[package]
name = "wk-371tti-net"
version = "2.1.0"
edition = "2024"

[dependencies]
kurosabi = { version = "0.6.16", features = ["tokio-server", "json", "file"] }
tokio = { version = "1.49.0", features = ["full"] }
comrak = { version = "0.50.0", default-features = true }
pulldown-latex = "0.7"
env_logger = "0.11.8"
log = "0.4"
tf-idf-vectorizer = "0.10.1"
dashmap = "6.1.0"
gray_matter = "0.3.2"
serde = "1.0.228"
chrono = "0.4.44"
serde_yaml = "0.9.34"
tar = "0.4.44"
zstd = "0.13.3"
flate2 = "1.0"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
] }
arc-swap = "1.8.2"
serde_json = "1.0"
