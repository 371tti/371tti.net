name: Release (v2)

on:
  push:
    branches: ["v2"]

# 同時に複数pushが来たときの競合を抑える
concurrency:
  group: release-v2
  cancel-in-progress: false

permissions:
  contents: write   # tag作成 + release作成に必要

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Decide version/tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags確認するので履歴が必要

      - name: Read version from Cargo.toml (via cargo metadata)
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          ver="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          tag="${{ steps.ver.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists -> skip release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $tag does not exist -> will release"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build release binaries
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            artifact_name: app-linux-x86_64
            bin_ext: ""
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            artifact_name: app-windows-x86_64
            bin_ext: ".exe"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.rust_target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (release)
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target "${{ matrix.rust_target }}"

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          BIN_NAME="wk-371tti-net"
          SRC="target/${{ matrix.rust_target }}/release/${BIN_NAME}${{ matrix.bin_ext }}"
          mkdir -p dist
          cp "$SRC" "dist/${BIN_NAME}${{ matrix.bin_ext }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create tag + GitHub Release
    needs: [plan, build]
    if: needs.plan.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.plan.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          name: ${{ needs.plan.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/**/*